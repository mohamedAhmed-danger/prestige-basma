version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prestige_basma_app
    restart: unless-stopped
    ports:
      - "8899:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-prestige_basma_secret_key_2026}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-localhost}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-برستيج بصمة}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-http://localhost:5000}
      - DATABASE_URL=sqlite:////app/instance/geoattend.db
    volumes:
      - sqlite_data:/app/instance

volumes:
  sqlite_data:
